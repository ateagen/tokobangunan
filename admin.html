<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin POS</title>

<style>
:root{
  --green:#1fbf75;
  --green-dark:#159c5f;
  --green-soft:#f8f1f1;
  --bg:#31c77c;
  --text:#1f2937;
  --white:#ffffff;
  --shadow:0 10px 25px rgba(0,0,0,.08);
  --danger:#e74c3c;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,BlinkMacSystemFont}

body{
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

/* Container admin */
.container{
  width:100%;
  max-width:1100px;
  padding:24px;
  display:none;
}

/* Header */
.header{
  background:var(--white);
  padding:28px;
  border-radius:18px;
  box-shadow:var(--shadow);
  margin-bottom:24px;
  text-align:center;
}

.header h1{
  font-size:28px;
  margin-bottom:6px;
  color:var(--green-dark);
}

.header p{
  font-size:15px;
  opacity:.8;
}

/* Grid card */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
  margin-top:20px;
}

.card{
  background:var(--white);
  border-radius:18px;
  padding:26px;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:.25s ease;
  text-align:center;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 15px 30px rgba(0,0,0,.12);
}

.card .icon{
  font-size:38px;
  margin-bottom:14px;
}

.card h3{
  font-size:18px;
  margin-bottom:6px;
}

.card span{
  font-size:13px;
  opacity:.7;
}

/* Buttons & inputs */
button, input[type="text"], input[type="password"], select{
  font-size:16px;
  padding:10px 16px;
  border-radius:10px;
  border:none;
  outline:none;
  cursor:pointer;
  transition:.25s ease;
}

button{
  background:var(--green);
  color:var(--white);
}

button:hover{
  background:var(--green-dark);
}

button.danger{background:var(--danger);}
button.danger:hover{background:#c0392b;}

/* Modal umum */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:99;
}

.modal-box{
  background:var(--white);
  padding:24px;
  border-radius:16px;
  width:90%;
  max-width:400px;
  text-align:center;
  box-shadow:var(--shadow);
}

.modal-box h4{
  margin-bottom:15px;
  word-break:break-word;
}

.modal-box input{
  width:90%;
  margin:10px 0;
  padding:12px;
  border-radius:10px;
  border:1px solid #1f2937;
  font-size:16px;
}

.modal-box button{
  margin-top:15px;
  width:50%;
  font-weight:bold;
  transition:.25s ease;
}

.modal-box button:hover{
  opacity:0.85;
}

/* Loading spinner */
.loading{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
}

.spinner{
  width:50px;
  height:50px;
  border:6px solid #d1fae5;
  border-top:6px solid var(--green);
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* TABEL AKUN STYLE */
#tableAkun{
  width:100%;
  border-collapse:collapse;
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

#tableAkun th, #tableAkun td{
  border:1px solid #cbd5e1;
  padding:10px;
  text-align:left;
}

#tableAkun th{
  background:var(--green-soft);
  font-weight:bold;
}

#tableAkun tbody tr:nth-child(even){background:#f8fafc;}
#tableAkun tbody tr:hover{background:#dcfce7;}
</style>
</head>

<body>

<!-- Loading -->
<div class="loading" id="loading">
  <div class="spinner"></div>
</div>


<!-- Modal Login -->
<div class="modal" id="modalLogin" style="display:flex;">
  <div class="modal-box">
    <h4>Login Admin</h4>
    <a href="index.html"><button>kembali</button></a>
    <input type="text" id="loginUsername" placeholder="Username">
    <input type="password" id="loginPassword" placeholder="Password">
    <button onclick="loginAdmin()">Login</button>
    <p id="loginError" style="color:var(--danger); margin-top:10px; font-size:14px; display:none;"></p>
  </div>
</div>

<!-- Kontainer Admin -->
<div class="container" id="adminContainer">
  <div class="header">
    <h1>Admin POS</h1>
    <p>Kelola toko dan laporan</p>
    <button onclick="clearSessionAdmin(); window.location.href='index.html'">⬅ Kembali ke POS</button>
  </div>

  <!-- Form ubah nama toko -->
  <div style="background:white; padding:20px; border-radius:18px; box-shadow:var(--shadow); margin-bottom:20px;">
    <h3>Ubah Nama Toko</h3>
    <input type="text" id="inputNamaToko" placeholder="Masukkan nama toko baru" style="width:70%; border: #1f2937 solid 1px;">
    <button onclick="showYesNoModal('Konfirmasi','Simpan nama toko baru?', updateNamaToko)">Simpan</button>
  </div>

  <!-- Form update saldo kas -->
  <div style="background:white; padding:20px; border-radius:18px; box-shadow:var(--shadow); margin-bottom:20px;">
    <h3>Update Saldo Kas</h3>
    <input type="text" id="inputSaldoKas" placeholder="Masukkan saldo kas baru" style="width:50%; border: #1f2937 solid 1px;">
    <button onclick="showYesNoModal('Konfirmasi','Simpan saldo kas baru?', updateSaldoKas)">Simpan</button>
  </div>

  <!-- Form tambah akun -->
  <div style="background:white; padding:20px; border-radius:18px; box-shadow:var(--shadow); margin-bottom:20px;">
    <h3>Tambah Akun</h3>

    <!-- TAMBAHAN NAMA -->
    <input type="text" id="inputNamaAkun" placeholder="Nama Lengkap" style="width:45%; border: #1f2937 solid 1px; margin-top:10px;">

    <input type="text" id="inputUsernameAkun" placeholder="Username" style="width:45%; border: #1f2937 solid 1px; margin-top:10px;">
    <input type="text" id="inputPasswordAkun" placeholder="Password" style="width:45%; border: #1f2937 solid 1px; margin-top:10px;">
    <select id="inputRoleAkun" style="width:45%; margin-top:10px; padding:10px; border-radius:10px; border: #1f2937 solid 1px;">
      <option value="admin">Admin</option>
      <option value="kasir">Kasir</option>
    </select>
    <button onclick="showYesNoModal('Konfirmasi','Tambah akun baru?', tambahAkun)">Simpan</button>
  </div>

  <!-- Tabel akun -->
  <div style="background:white; padding:20px; border-radius:18px; box-shadow:var(--shadow); margin-bottom:20px;">
    <h3>Daftar Akun</h3>
    <table id="tableAkun">
      <thead>
        <tr>
          <th>Username</th>
          <th>Password</th>
          <th>Role</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Grid Button -->
  <div class="grid">
    <div class="card" onclick="window.location.href='stok.html'">
      <div class="icon">📦</div>
      <h3>Kelola Stok</h3>
      <span>Tambah, ubah, hapus stok</span>
    </div>
    <div class="card" onclick="window.location.href='laporan.html'">
      <div class="icon">📊</div>
      <h3>Laporan Penjualan</h3>
      <span>Melihat laporan penjualan</span>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://fgoeqtyaxwccxluxdvni.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ZXJgBsB-sswr7qblwGMnLg_p6QaXKwP";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loading = document.getElementById('loading');
const modal = document.getElementById('modal');
const modalMsg = document.getElementById('modalMsg');
const modalTitle = document.getElementById('modalTitle');
const modalLogin = document.getElementById('modalLogin');
const adminContainer = document.getElementById('adminContainer');
const loginError = document.getElementById('loginError');

function showLoading(show=true){ loading.style.display = show?'flex':'none'; }
function showInfoModal(title,msg){
  modalTitle.textContent = title;
  modalMsg.textContent = msg;
  modal.style.display='flex';
  setTimeout(()=>{ modal.style.display='none'; },1000);
}

/* ================= SESSION ================= */
function saveSessionAdmin(data){
  localStorage.setItem('admin_session', JSON.stringify({
    id: data.id,
    username: data.username,
    role: data.role
  }));
}
function getSessionAdmin(){
  const s = localStorage.getItem('admin_session');
  return s ? JSON.parse(s) : null;
}
function clearSessionAdmin(){
  localStorage.removeItem('admin_session');
}

/* ---------- LOGIN ---------- */
async function loginAdmin(){
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  if(!username || !password){ 
    loginError.textContent = 'Semua field harus diisi';
    loginError.style.display = 'block';
    return; 
  }
  showLoading(true);
  try{
    const { data } = await supabaseClient.from('akun')
      .select('*')
      .eq('username',username)
      .eq('password',password)
      .eq('role','admin')
      .limit(1)
      .single();

    showLoading(false);

    if(!data){ 
      loginError.textContent = 'Username atau password salah';
      loginError.style.display = 'block';
      return; 
    } else {
      loginError.style.display = 'none';
    }

    saveSessionAdmin(data);

    modalLogin.style.display='none';
    adminContainer.style.display='block';
  
    loadNamaToko();
    loadSaldoKas();
    loadAkun();
  }catch(err){
    showLoading(false);
    loginError.textContent = 'Username atau password salah';
    loginError.style.display = 'block';
  }
}

/* AUTO LOGIN */
document.addEventListener('DOMContentLoaded', ()=>{
  const session = getSessionAdmin();
  if(session){
    modalLogin.style.display='none';
    adminContainer.style.display='block';
    loadNamaToko();
    loadSaldoKas();
    loadAkun();
  }
});

/* ---------- ADMIN FUNCTIONS (ASLI, TIDAK DIUBAH) ---------- */
async function loadNamaToko(){
  showLoading(true);
  try{
    const { data, error } = await supabaseClient.from('toko').select('nama').limit(1).single();
    showLoading(false);
    if(error || !data){ showInfoModal('Gagal','Nama toko tidak dapat dimuat'); return; }
    document.getElementById('inputNamaToko').value = data.nama;
  }catch(err){ showLoading(false); showInfoModal('Error','Terjadi kesalahan saat memuat data'); }
}

async function updateNamaToko(){
  const newName = document.getElementById('inputNamaToko').value.trim();
  if(!newName){ showInfoModal('Gagal','Nama toko tidak boleh kosong'); return; }
  showLoading(true);
  try{
    const { error } = await supabaseClient.from('toko').update({ nama:newName }).eq('id',1);
    showLoading(false);
    if(error){ showInfoModal('Gagal','Tidak dapat menyimpan nama toko'); return; }
    showInfoModal('Berhasil','Nama toko berhasil diperbarui');
  }catch(err){ showLoading(false); showInfoModal('Error','Terjadi kesalahan saat menyimpan'); }
}

async function loadSaldoKas(){
  showLoading(true);
  try{
    const { data, error } = await supabaseClient
      .from('kas').select('*').order('id',{ascending:false}).limit(1).single();
    showLoading(false);
    document.getElementById('inputSaldoKas').value = data?.sisa_saldo || '';
  }catch(err){ showLoading(false); }
}

async function updateSaldoKas(){
  const newSaldo = parseFloat(document.getElementById('inputSaldoKas').value);
  if(isNaN(newSaldo)){ showInfoModal('Gagal','Saldo tidak valid'); return; }
  showLoading(true);
  try{
    const { data: latestKas } = await supabaseClient
      .from('kas').select('*').order('id',{ascending:false}).limit(1).single();
    if(!latestKas){ showLoading(false); showInfoModal('Gagal','Data kas tidak ditemukan'); return; }
    const { error } = await supabaseClient.from('kas')
      .update({ sisa_saldo:newSaldo, tgl:new Date().toISOString() })
      .eq('id',latestKas.id);
    showLoading(false);
    if(error){ showInfoModal('Gagal','Tidak dapat menyimpan saldo kas'); return; }
    document.getElementById('inputSaldoKas').value = newSaldo;
    showInfoModal('Berhasil','Saldo kas berhasil diperbarui');
  }catch(err){ showLoading(false); showInfoModal('Error','Terjadi kesalahan saat menyimpan saldo'); }
}

/* ---------- TAMBAH AKUN (DIPERBAIKI) ---------- */
async function tambahAkun(){
  const nama = document.getElementById('inputNamaAkun').value.trim();
  const username = document.getElementById('inputUsernameAkun').value.trim();
  const password = document.getElementById('inputPasswordAkun').value.trim();
  const role = document.getElementById('inputRoleAkun').value;
  if(!nama || !username || !password){ showInfoModal('Gagal','Semua field harus diisi'); return; }
  showLoading(true);
  try{
    await supabaseClient.from('akun').insert([{ nama, username, password, role }]);
    showLoading(false);
    loadAkun();
    showInfoModal('Berhasil','Akun berhasil ditambahkan');
  }catch(err){ showLoading(false); showInfoModal('Error','Terjadi kesalahan saat menambah akun'); }
}

async function loadAkun(){
  try{
    const { data } = await supabaseClient.from('akun').select('*').order('id',{ascending:true});
    const tbody = document.querySelector('#tableAkun tbody');
    tbody.innerHTML = '';
    data.forEach(a=>{
      tbody.innerHTML += `<tr>
        <td>${a.username}</td>
        <td>${a.password}</td>
        <td>${a.role}</td>
        <td><button class="danger" onclick="showYesNoModal('Konfirmasi','Hapus akun ${a.username}?',()=>hapusAkun(${a.id}))">Hapus</button></td>
      </tr>`;
    });
  }catch(err){}
}

async function hapusAkun(id){
  showLoading(true);
  try{
    await supabaseClient.from('akun').delete().eq('id',id);
    showLoading(false);
    loadAkun();
    showInfoModal('Berhasil','Akun berhasil dihapus');
  }catch(err){ showLoading(false); showInfoModal('Error','Terjadi kesalahan saat menghapus akun'); }
}

/* Modal konfirmasi Ya/Tidak */
function showYesNoModal(title, msg, yesCallback=null){
  const modalBox = modal.querySelector('.modal-box');
  modalBox.querySelectorAll('.yesno-btn')?.forEach(b=>b.remove());
  modalTitle.textContent = title;
  modalMsg.textContent = msg;
  modal.style.display='flex';

  const yesBtn = document.createElement('button');
  yesBtn.textContent='Ya';
  yesBtn.className='yesno-btn';
  yesBtn.style.marginTop='10px';
  yesBtn.style.marginRight='10px';
  yesBtn.onclick = async ()=>{
    modalBox.querySelectorAll('.yesno-btn').forEach(b=>b.remove());
    if(yesCallback) await yesCallback();
  };
  modalBox.appendChild(yesBtn);

  const noBtn = document.createElement('button');
  noBtn.textContent='Tidak';
  noBtn.className='yesno-btn';
  noBtn.style.marginTop='10px';
  noBtn.onclick = ()=> modal.style.display='none';
  modalBox.appendChild(noBtn);
}
</script>

</body>
</html>
