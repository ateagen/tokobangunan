<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Stok</title>

<style>
:root{
  --green:#4fd1a5;
  --green-dark:#2fb389;
  --green-soft:#e9f8f2;
  --bg:#f4fbf8;
  --text:#134e3a;
  --white:#ffffff;
  --border:#d1fae5;
  --danger:#fee2e2;
  --danger-text:#991b1b;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:system-ui, Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* ================= HEADER ================= */
header{
  background:var(--green);
  color:white;
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h2{
  margin:0;
  font-size:18px;
}

/* ================= BUTTON ================= */
button{
  background:white;
  color:var(--green-dark);
  border:1px solid var(--green-dark);
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
  transition:.2s ease;
}

button:hover{
  background:var(--green-dark);
  color:white;
  transform:translateY(-1px);
}

button:active{
  transform:translateY(0);
}

/* ================= LAYOUT ================= */
.container{
  padding:16px;
  max-width:1200px;
  margin:auto;
}

/* ================= MENU GRID ================= */
.menu-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:20px;
  margin-top:20px;
}

.menu-card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:12px;
  padding:35px 20px;
  text-align:center;
  cursor:pointer;
  transition:.2s ease;
}

.menu-card:hover{
  background:var(--green-soft);
  border-color:var(--green);
  transform:translateY(-2px);
}

.menu-card:active{
  transform:translateY(0);
}

.menu-icon{
  font-size:40px;
  margin-bottom:12px;
}

.menu-card h3{
  margin:0 0 8px 0;
  font-size:17px;
  color:var(--text);
}

.menu-card p{
  margin:0;
  font-size:13px;
  opacity:.7;
}

/* ================= RESPONSIVE ================= */
@media(max-width:768px){
  .menu-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h2>Log & Riwayat Stok</h2>
  <button onclick="location.href='index.html'">Kembali</button>
</header>

<div class="container">

  <div class="menu-grid">

    <!-- STOK AKTIF -->
    <div class="menu-card" onclick="location.href='stok-aktif.html'">
      <div class="menu-icon">📦</div>
      <h3>Stok Aktif</h3>
      <p>Lihat daftar barang dan jumlah stok aktif</p>
    </div>

    <!-- RIWAYAT STOK -->
    <div class="menu-card" onclick="location.href='riwayat-stok.html'">
      <div class="menu-icon">📋</div>
      <h3>Riwayat Perubahan Stok</h3>
      <p>Lihat riwayat perubahan, edit dan penghapusan stok</p>
    </div>

  </div>

</div>

</body>
</html>
