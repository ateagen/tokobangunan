<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Penjualan</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
:root{
  --green:#4fd1a5;
  --green-dark:#2fb389;
  --green-soft:#e9f8f2;
  --bg:#f4fbf8;
  --text:#134e3a;
  --danger:#e74c3c;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--green);color:white;padding:16px;display:flex;justify-content:space-between;align-items:center}
button{border:none;padding:10px 14px;border-radius:6px;cursor:pointer;background:var(--green);color:white;}
button.secondary{background:white;color:var(--green-dark);border:1px solid var(--green-dark);}
button.danger{background:var(--danger)}
button:hover{background:var(--green-dark)}
.container{padding:16px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
input[type=date], select{padding:8px;border-radius:6px;border:1px solid #ccc;}
.table-wrap{background:white;border-radius:10px;overflow:auto;margin-bottom:24px;}
table{width:100%;border-collapse:collapse;border:1px solid #cbd5e1;}
th, td{padding:10px;border:1px solid #cbd5e1;font-size:14px;}
th{background:var(--green-soft);font-weight:bold;text-align:left;}
tbody tr:nth-child(even){background:#f8fafc;}
tbody tr:hover{background:#dcfce7;}
#boxKas{background:white;border:2px solid var(--green);border-radius:12px;padding:16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
#saldoKas{font-size:22px;font-weight:bold;}
.spinner{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.7);z-index:99;}
.spinner div{width:40px;height:40px;border:5px solid var(--green-soft);border-top:5px solid var(--green-dark);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<body>

<header>
  <h2>Laporan Penjualan</h2>
  <button class="secondary" onclick="location.href='admin.html'">Kembali ke Admin</button>
</header>

<div class="container">

  <div id="boxKas">
    <strong>💰 Saldo Kas</strong>
    <span id="saldoKas">Rp 0</span>
  </div>

  <div class="filters">
    <input type="date" id="from">
    <input type="date" id="to">
    <select id="filterJenis">
      <option value="all">Semua</option>
      <option value="penjualan">Penjualan</option>
      <option value="pengeluaran">Pengeluaran</option>
    </select>
    <button onclick="loadData()">Filter</button>
    <button onclick="downloadXLS()">Download XLS</button>
    <button class="danger" onclick="hapusTransaksi('old')">Hapus > 3 Bulan</button>
    <button class="danger" onclick="hapusTransaksi('all')">Hapus Semua</button>
  </div>

  <h3>Tabel Total</h3>
  <div class="table-wrap">
    <table id="tableTotal">
      <thead>
        <tr>
          <th>Tanggal</th>
          <th>Total Penjualan</th>
          <th>Total Pengeluaran</th>
          <th>Subtotal</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <h3>Detail Penjualan & Pengeluaran</h3>
  <div class="table-wrap">
    <table id="tableDetail">
      <thead>
        <tr>
          <th>Tanggal</th>
          <th>Nama Kasir</th>
          <th>Jenis</th>
          <th>Nama</th>
          <th>Jumlah</th>
          <th>Harga/Biaya</th>
          <th>Total</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<div class="spinner" id="spinner"><div></div></div>

<script>
const SUPABASE_URL="https://fgoeqtyaxwccxluxdvni.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_ZXJgBsB-sswr7qblwGMnLg_p6QaXKwP";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const spinner=document.getElementById('spinner');
function showSpinner(v){spinner.style.display=v?'flex':'none'}

let DATA_TOTAL=[], DATA_DETAIL=[];
function rupiah(n){return "Rp "+Number(n||0).toLocaleString("id-ID");}

async function loadKas(){
  const { data } = await db.from('kas').select('sisa_saldo').order('id',{ascending:false}).limit(1).single();
  if(data) saldoKas.innerText=rupiah(data.sisa_saldo);
}

(function(){
  const d=new Date().toISOString().split('T')[0];
  from.value=d; to.value=d;
})();

function tsStart(d){return d+"T00:00:00"}
function tsEnd(d){return d+"T23:59:59"}

async function loadData(){
  showSpinner(true);
  DATA_TOTAL=[]; DATA_DETAIL=[];
  const jenisFilter=filterJenis.value;

  const f=from.value,t=to.value;
  const {data:jual=[]}=await db.from('penjualan').select('*').gte('tgl',tsStart(f)).lte('tgl',tsEnd(t));
  const {data:keluar=[]}=await db.from('pengeluaran').select('*').gte('tgl',tsStart(f)).lte('tgl',tsEnd(t));

  const map={};
  tableDetail.querySelector('tbody').innerHTML='';

  if(jenisFilter!=='pengeluaran'){
    jual.forEach(r=>{
      const d=r.tgl.split('T')[0];
      map[d]=map[d]||{jual:0,keluar:0};
      map[d].jual+=Number(r.total);

      DATA_DETAIL.push({
        tanggal:new Date(r.tgl).toLocaleString(),
        nama_kasir:r.nama_kasir||'-',
        jenis:'Penjualan',
        nama:r.nama_barang,
        jumlah:r.jumlah,
        harga:r.total/r.jumlah,
        total:r.total
      });

      tableDetail.querySelector('tbody').innerHTML+=`
      <tr>
        <td>${new Date(r.tgl).toLocaleString()}</td>
        <td>${r.nama_kasir||'-'}</td>
        <td>Penjualan</td>
        <td>${r.nama_barang}</td>
        <td>${r.jumlah}</td>
        <td>${rupiah(r.total/r.jumlah)}</td>
        <td>${rupiah(r.total)}</td>
        <td><button class="danger" onclick="hapusDetail(${r.id},'penjualan')">Hapus</button></td>
      </tr>`;
    });
  }

  if(jenisFilter!=='penjualan'){
    keluar.forEach(r=>{
      const d=r.tgl.split('T')[0];
      map[d]=map[d]||{jual:0,keluar:0};
      map[d].keluar+=Number(r.jumlah);

      DATA_DETAIL.push({
        tanggal:new Date(r.tgl).toLocaleString(),
        nama_kasir:r.nama_kasir||'-',
        jenis:'Pengeluaran',
        nama:r.deskripsi,
        jumlah:'-',
        harga:r.jumlah,
        total:r.jumlah
      });

      tableDetail.querySelector('tbody').innerHTML+=`
      <tr>
        <td>${new Date(r.tgl).toLocaleString()}</td>
        <td>${r.nama_kasir||'-'}</td>
        <td>Pengeluaran</td>
        <td>${r.deskripsi}</td>
        <td>-</td>
        <td>${rupiah(r.jumlah)}</td>
        <td>${rupiah(r.jumlah)}</td>
        <td><button class="danger" onclick="hapusDetail(${r.id},'pengeluaran')">Hapus</button></td>
      </tr>`;
    });
  }

  tableTotal.querySelector('tbody').innerHTML='';
  Object.keys(map).sort().forEach(d=>{
    const subtotal=map[d].jual-map[d].keluar;
    DATA_TOTAL.push({tanggal:d,total_penjualan:map[d].jual,total_pengeluaran:map[d].keluar,subtotal});
    tableTotal.querySelector('tbody').innerHTML+=`
    <tr>
      <td>${d}</td>
      <td>${rupiah(map[d].jual)}</td>
      <td>${rupiah(map[d].keluar)}</td>
      <td>${rupiah(subtotal)}</td>
      <td><button class="danger" onclick="hapusTotal('${d}')">Hapus</button></td>
    </tr>`;
  });

  showSpinner(false);
  loadKas();
}

function downloadXLS(){
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DATA_TOTAL),'TOTAL');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DATA_DETAIL),'DETAIL');
  XLSX.writeFile(wb,'laporan_penjualan.xlsx');
}

async function hapusDetail(id,jenis){
  if(!confirm("Hapus transaksi ini?"))return;
  await db.from(jenis).delete().eq('id',id);
  loadData();
}

async function hapusTotal(tgl){
  if(!confirm(`Hapus semua transaksi tanggal ${tgl}?`))return;
  await db.from('penjualan').delete().gte('tgl',tgl+'T00:00:00').lte('tgl',tgl+'T23:59:59');
  await db.from('pengeluaran').delete().gte('tgl',tgl+'T00:00:00').lte('tgl',tgl+'T23:59:59');
  loadData();
}

async function hapusTransaksi(type){
  if(!confirm("Lanjutkan?"))return;
  if(type==='old'){
    const d=new Date(); d.setMonth(d.getMonth()-3);
    const f=d.toISOString().split('T')[0]+'T00:00:00';
    await db.from('penjualan').delete().lt('tgl',f);
    await db.from('pengeluaran').delete().lt('tgl',f);
  }else{
    await db.from('penjualan').delete();
    await db.from('pengeluaran').delete();
  }
  loadData();
}

loadKas();
loadData();
</script>
</body>
</html>
