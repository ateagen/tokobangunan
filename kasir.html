<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasir Toko</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --green:#1fbf75;
  --green-dark:#159c5f;
  --green-soft:#e9f8f1;
  --bg:#e0f7f1;
  --white:#ffffff;
  --text:#1f2937;
  --shadow:0 10px 25px rgba(0,0,0,.08);
}
*{box-sizing:border-box;font-family:system-ui;margin:0;padding:0}
body{background:var(--bg);padding:20px;color:var(--text)}
.container{max-width:1200px;margin:auto}
.header{
  background:var(--white);
  padding:20px;
  border-radius:18px;
  box-shadow:var(--shadow);
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}
h1{color:var(--green-dark)}
.card{
  background:var(--white);
  padding:20px;
  border-radius:18px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
}
input,button{padding:10px;border-radius:10px;border:1px solid #ccc;font-size:15px}
button{background:var(--green);color:white;border:none;cursor:pointer}
button:hover{background:var(--green-dark)}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:12px;text-align:center;border-bottom:1px solid #eee}
th{background:var(--green-soft)}
tr.stok-row{cursor:pointer}
.loading,.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center}
.loading{background:rgba(255,255,255,.7);z-index:100}
.modal{background:rgba(0,0,0,.45);z-index:200}
.modal-box{
  background:white;padding:20px;border-radius:16px;
  max-width:600px;width:90%;text-align:center;
}
.spinner{width:50px;height:50px;border:6px solid #d1fae5;border-top:6px solid var(--green);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media print{
  body *{visibility:hidden}
  #printArea, #printArea *{visibility:visible}
  #printArea{
    position:absolute;
    left:0;top:0;
    width:220px;
    font-family:monospace;
    font-size:12px;
  }
}
</style>
</head>
<body>

<div class="loading" id="loading"><div class="spinner"></div></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p id="modalMsg"></p>
    <div id="modalForm"></div>
    <div id="modalBtns" style="margin-top:12px;display:flex;gap:10px;justify-content:center"></div>
  </div>
</div>

<div class="modal" id="loginModal" style="display:flex;background:rgba(0,0,0,.6);z-index:300;">
  <div class="modal-box">
    <h3>Login Kasir</h3>
    <a href="index.html"><button>kembali</button></a>
    <input id="loginUsername" placeholder="Username" style="margin-bottom:10px;width:100%;">
    <input id="loginPassword" type="password" placeholder="Password" style="margin-bottom:10px;width:100%;">
    <button onclick="login()" style="width:100%;">Login</button>
    <p id="loginError" style="color:red;margin-top:10px;display:none;font-size:14px;"></p>
  </div>
</div>

<div class="container">

<div class="header">
  <div>
    <h1 id="namaToko">Kasir</h1>
    <small id="jam"></small>
  </div>
  <button onclick="logout()">⬅ Kembali</button>
</div>

<div class="card">
  <button onclick="tambahPengeluaranModal()">➕ Tambah Pengeluaran</button>
  <input id="search" placeholder="Cari barang..." oninput="loadStok()" style="margin-top:10px;">
  <table>
    <thead><tr><th>Barang</th><th>Harga</th><th>Stok</th></tr></thead>
    <tbody id="listStok"></tbody>
  </table>
</div>

<div class="card">
  <h3>Keranjang</h3>
  <table>
    <thead><tr><th>Barang</th><th>Harga</th><th>Qty</th><th>Total</th><th></th></tr></thead>
    <tbody id="cart"></tbody>
  </table>
</div>

<div class="card">
  <div>Total: <b id="total">0</b></div>
  <input id="diskon" type="number" placeholder="Diskon" oninput="hitung()" style="margin-top:10px;">
  <input id="bayar" type="number" placeholder="Uang bayar" oninput="hitung()" style="margin-top:10px;">
  <div>Kembalian: <b id="kembali">0</b></div>

  <!-- ===== TAMBAHAN FORM KONSUMEN (PATUH) ===== -->
  <input id="namaKonsumen" placeholder="Nama Konsumen" style="margin-top:10px;">
  <input id="hpKonsumen" placeholder="No HP Konsumen" style="margin-top:10px;">
  <input id="alamatKonsumen" placeholder="Alamat Konsumen" style="margin-top:10px;">

  <button onclick="konfirmasiBayar()" style="margin-top:10px;">BAYAR</button>
  <button onclick="printUlang()" style="margin-top:10px;background:#444;">PRINT LAGI</button>
</div>

</div>

<div id="printArea"></div>

<script>
let lastPrintHtml = "";

/* ================== SESSION LOGIN ================== */
function setLoginSession(nama){
  sessionStorage.setItem("kasir_login","1");
  sessionStorage.setItem("kasir_nama",nama);
}
function clearLoginSession(){
  sessionStorage.removeItem("kasir_login");
  sessionStorage.removeItem("kasir_nama");
}
window.addEventListener("beforeunload", clearLoginSession);

/* ================== SUPABASE ================== */
const SUPABASE_URL="https://fgoeqtyaxwccxluxdvni.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_ZXJgBsB-sswr7qblwGMnLg_p6QaXKwP";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

/* ================== STATE ================== */
let keranjang=[];
let namaKasir="";
let namaTokoText="TOKO";

setInterval(()=>{jam.textContent=new Date().toLocaleString()},1000);

/* ================== LOGIN ================== */
async function login(){
  const u=loginUsername.value.trim();
  const p=loginPassword.value.trim();
  loginError.style.display="none";

  const {data}=await supabaseClient
    .from("akun")
    .select("*")
    .eq("username",u)
    .eq("password",p)
    .single();

  if(!data){
    loginError.textContent="Username atau password salah";
    loginError.style.display="block";
    return;
  }

  namaKasir=u;
  setLoginSession(u);
  loginModal.style.display="none";
  loadToko();
  loadStok();
}

/* ================== AUTO LOGIN ================== */
if(sessionStorage.getItem("kasir_login")){
  namaKasir=sessionStorage.getItem("kasir_nama");
  loginModal.style.display="none";
  loadToko();
  loadStok();
}

/* ================== LOGOUT ================== */
function logout(){
  clearLoginSession();
  window.location.href="index.html";
}

/* ================== DATA ================== */
async function loadToko(){
  const {data}=await supabaseClient.from("toko").select("nama").single();
  if(data){
    namaToko.textContent=data.nama;
    namaTokoText=data.nama;
  }
}

async function loadStok(){
  const q=search.value||"";
  const {data}=await supabaseClient.from("stok").select("*").ilike("nama_barang","%"+q+"%");
  listStok.innerHTML="";
  data.forEach(s=>{
    const tr=document.createElement("tr");
    tr.className="stok-row";
    tr.onclick=()=>tambahKeKeranjang(s);
    tr.innerHTML=`<td>${s.nama_barang}</td><td>${s.harga_jual}</td><td>${s.jumlah}</td>`;
    listStok.appendChild(tr);
  });
}

/* ================== KERANJANG ================== */
function tambahKeKeranjang(i){
  const ada=keranjang.find(x=>x.id===i.id);
  if(ada) ada.qty++;
  else keranjang.push({...i,qty:1});
  renderCart();
}

function renderCart(){
  cart.innerHTML="";
  keranjang.forEach((i,idx)=>{
    cart.innerHTML+=`
    <tr>
      <td>${i.nama_barang}</td>
      <td>${i.harga_jual}</td>
      <td>
        <button onclick="ubahQty(${idx},-1)">-</button>
        <input value="${i.qty}" onchange="setQty(${idx},this.value)" style="width:50px">
        <button onclick="ubahQty(${idx},1)">+</button>
      </td>
      <td>${i.qty*i.harga_jual}</td>
      <td><button onclick="hapusItem(${idx})">x</button></td>
    </tr>`;
  });
  hitung();
}

function ubahQty(i,n){keranjang[i].qty=Math.max(1,keranjang[i].qty+n);renderCart()}
function setQty(i,v){keranjang[i].qty=Math.max(1,Number(v));renderCart()}
function hapusItem(i){keranjang.splice(i,1);renderCart()}

function hitung(){
  const t=keranjang.reduce((a,b)=>a+b.qty*b.harga_jual,0);
  const d=Number(diskon.value)||0;
  total.textContent=t-d;
  kembali.textContent=(Number(bayar.value)||0)-(t-d);
}

/* ================== BAYAR & PREVIEW STRUK ================== */
function konfirmasiBayar(){
  if(!keranjang.length)
    return showModal("Gagal","Keranjang kosong","<button onclick='closeModal()'>OK</button>");

  const now = new Date().toLocaleString("id-ID");
  let previewHtml = `<div style="font-family:monospace; font-size:10px; text-align:left;">`;
  previewHtml += `<div style="text-align:center;"><b>${namaTokoText}</b></div>`;
  previewHtml += `<div>Tanggal: ${now}</div>`;
  previewHtml += `<div>Kasir: ${namaKasir}</div>`;
  previewHtml += `<div>Nama: ${namaKonsumen.value}</div>`;
  previewHtml += `<div>HP: ${hpKonsumen.value}</div>`;
  previewHtml += `<div>Alamat: ${alamatKonsumen.value}</div>`;
  previewHtml += `<div>-----------------------------</div>`;

  keranjang.forEach(i=>{
    const subtotal = i.qty * i.harga_jual;
    previewHtml += `${i.nama_barang} (${i.harga_jual}/pcs x ${i.qty}) Rp ${subtotal.toLocaleString('id-ID')}<br>`;
  });

  const totalSebelumDiskon = keranjang.reduce((a,b)=>a+b.qty*b.harga_jual,0);
  const diskonVal = Number(diskon.value) || 0;
  const totalSetelahDiskon = totalSebelumDiskon - diskonVal;
  const bayarVal = Number(bayar.value) || 0;
  const kembaliVal = bayarVal - totalSetelahDiskon;

  previewHtml += `-----------------------------<br>`;
  previewHtml += `Total: Rp ${totalSebelumDiskon.toLocaleString('id-ID')}<br>`;
  previewHtml += `Diskon: Rp ${diskonVal.toLocaleString('id-ID')}<br>`;
  previewHtml += `Bayar: Rp ${bayarVal.toLocaleString('id-ID')}<br>`;
  previewHtml += `Kembali: Rp ${kembaliVal.toLocaleString('id-ID')}<br>`;
  previewHtml += `-----------------------------<br>`;
  previewHtml += `<div style="text-align:center;">-- Terima Kasih --</div>`;
  previewHtml += `</div>`;

  showModal("Preview Struk","",`
    <div id="previewStruk" style="max-height:300px; overflow-y:auto; border:1px solid #ccc; padding:10px; background:#fff;">
      ${previewHtml}
    </div>
    <button onclick="closeModal();prosesBayar(true)" style="margin-top:10px;">Cetak</button>
    <button onclick="closeModal();prosesBayar(false)" style="margin-top:10px;">Batal</button>
  `);
}

/* ================== PROSES BAYAR ================== */
async function prosesBayar(cetak){
  showLoading(true);

  for(const i of keranjang){
    await supabaseClient.from("penjualan").insert({
      nama_barang: i.nama_barang,
      jumlah: i.qty,
      total: i.qty * i.harga_jual,
      nama_kasir: namaKasir
    });

    await supabaseClient.from("stok")
      .update({jumlah: i.jumlah - i.qty}).eq("id", i.id);
  }

  if(cetak) cetakStruk();

  keranjang = [];
  renderCart();
  showLoading(false);
}

/* ================== STRUK PRINT ================== */
function cetakStruk(){
  const now = new Date().toLocaleString("id-ID");
  const resto = namaTokoText;

  const totalSebelumDiskon = keranjang.reduce((a,b)=>a+b.qty*b.harga_jual,0);
  const diskonVal = Number(diskon.value) || 0;
  const totalSetelahDiskon = totalSebelumDiskon - diskonVal;
  const bayarVal = Number(bayar.value) || 0;
  const kembaliVal = bayarVal - totalSetelahDiskon;

  let html = `
    <html>
    <head>
      <style>
        @page { size:58mm auto; margin:0; }
        body { font-family: monospace; font-size:10px; }
        .center { text-align:center; }
        .line { border-top:1px dashed #000; margin:4px 0; }
      </style>
    </head>
    <body>
      <div class="center"><b>${resto}</b></div>
      <div>Tanggal: ${now}</div>
      <div>Kasir: ${namaKasir}</div>
      <div>Nama: ${namaKonsumen.value}</div>
      <div>HP: ${hpKonsumen.value}</div>
      <div>Alamat: ${alamatKonsumen.value}</div>
      <div class="line"></div>
  `;

  keranjang.forEach(i=>{
    const subtotal = i.qty * i.harga_jual;
    html += `${i.nama_barang} (${i.harga_jual}/pcs x ${i.qty}) Rp ${subtotal.toLocaleString('id-ID')}<br>`;
  });

  html += `<div class="line"></div>`;
  html += `Total: Rp ${totalSebelumDiskon.toLocaleString('id-ID')}<br>`;
  html += `Diskon: Rp ${diskonVal.toLocaleString('id-ID')}<br>`;
  html += `Bayar: Rp ${bayarVal.toLocaleString('id-ID')}<br>`;
  html += `Kembali: Rp ${kembaliVal.toLocaleString('id-ID')}<br>`;
  html += `<div class="line"></div>`;
  html += `<div class="center">-- Terima Kasih --</div>`;
  html += `</body></html>`;

  lastPrintHtml = html;

  const win = window.open('', '_blank', 'width=300,height=600');
  win.document.write(html);
  win.document.close();
  win.print();
  setTimeout(()=>win.close(),500);
}

/* ================== PRINT ULANG ================== */
function printUlang(){
  if(!lastPrintHtml) return;
  const win = window.open('', '_blank', 'width=300,height=600');
  win.document.write(lastPrintHtml);
  win.document.close();
  win.print();
  setTimeout(()=>win.close(),500);
}

/* ================== PENGELUARAN ================== */
function tambahPengeluaranModal(){
  showModal("Tambah Pengeluaran","",
    `<input id="ket" placeholder="Keterangan" style="width:200px">
     <input id="biaya" type="number" placeholder="Biaya">
     <button onclick="simpanPengeluaran()">Simpan</button>
     <button style="background:#ccc;color:#000" onclick="closeModal()">Batal</button>`
  );
}
async function simpanPengeluaran(){
  const k=ket.value;
  const b=Number(biaya.value);
  if(!k||b<=0) return;
  await supabaseClient.from("pengeluaran").insert({
    deskripsi:k,
    jumlah:b,
    nama_kasir:namaKasir
  });
  closeModal();
}

/* ================== UTIL ================== */
function showLoading(v){loading.style.display=v?"flex":"none"}
function showModal(t,m,b){
  modalTitle.textContent=t;
  modalMsg.textContent=m;
  modalForm.innerHTML="";
  modalBtns.innerHTML=b;
  modal.style.display="flex";
}
function closeModal(){modal.style.display="none"}
</script>

</body>
</html>
